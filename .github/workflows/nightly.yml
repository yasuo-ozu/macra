# Nightly gates. It can, because an unmapped compiler now skips the proc-macro
# assertions instead of failing them: `bridge_abi_for` returns None for 1.98+ and for
# prereleases at an ABI boundary, so a nightly the hook cannot safely drive still runs
# the `macro_rules!` half, the build and the package smoke test. A red run therefore
# means something this repository can act on, not merely that upstream moved.
#
# Kept in its own file because it is the one workflow whose input changes on someone
# else's schedule, so it also runs on a timer rather than only on our commits.
name: Nightly

on:
  push:
    branches:
      - main
  pull_request:
  # Upstream moves on its own schedule, so check even when nothing lands here.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# A newer push supersedes this run: the old one can only report on code nobody is
# looking at any more, and the release matrix alone is 30 cells.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ( ${{ matrix.os }} nightly)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every environment CI covers: those internals move per platform as well as
        # per version, so an early warning is only useful if it spans the platforms
        # we ship.
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - macos-15-intel
          - ubuntu-24.04-arm
          - windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - uses: ./.github/action
        with:
          rust: nightly
