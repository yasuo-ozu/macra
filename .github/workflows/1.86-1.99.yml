# The release channels macra claims to support. Every cell gates, the 1.98 and 1.99
# cells included, since the proc-macro tests skip rather than fail on a compiler whose
# bridge ABI is unmapped or whose table layout the hook cannot drive, so a red cell
# there means something other than that known gap.
name: "1.86-1.99"

on:
  push:
    branches:
      - main
  pull_request:

# A newer push supersedes this run: the old one can only report on code nobody is
# looking at any more, and the release matrix alone is 36 cells.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ( ${{ matrix.os }} ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - macos-15-intel
          # The hook injects into rustc per platform — LD_PRELOAD on Linux, a DLL
          # injected through RUSTC_WRAPPER on Windows — so each architecture is worth
          # exercising, the same way both macOS architectures already are.
          - ubuntu-24.04-arm
          - windows-11-arm
        rust:
          - "1.86"
          - "1.95"
          - "1.96"
          - "1.97"
          - "1.98"
          - "1.99"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - uses: ./.github/action
        with:
          rust: ${{ matrix.rust }}
