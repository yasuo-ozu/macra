# The release channels macra claims to support. Every cell gates: 1.98 included, since
# the proc-macro tests skip rather than fail on a compiler with no mapped bridge ABI,
# so a red 1.98 means something other than the known unmapped table layout.
name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test ( ${{ matrix.os }} ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - macos-15-intel
          # The hook injects into rustc per platform — LD_PRELOAD on Linux, a DLL
          # injected through RUSTC_WRAPPER on Windows — so each architecture is worth
          # exercising, the same way both macOS architectures already are.
          - ubuntu-24.04-arm
          - windows-11-arm
        rust:
          - "1.86"
          - "1.95"
          - "1.96"
          - "1.97"
          - "1.98"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - uses: ./.github/action
        with:
          rust: ${{ matrix.rust }}
