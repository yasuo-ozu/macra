name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: clippy
        run: cargo clippy --workspace --no-deps -- -D warnings

      - name: Generate docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
  test:
    name: Test ( ${{ matrix.os }} ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - macos-15-intel
          # The hook injects into rustc per platform — LD_PRELOAD on Linux, a DLL
          # injected through RUSTC_WRAPPER on Windows — so each architecture is worth
          # exercising, the same way both macOS architectures already are.
          - ubuntu-24.04-arm
          - windows-11-arm
        rust:
          - "1.86"
          - "1.95"
          - "1.96"
          - "1.97"
          # 1.98 gates like the rest: the proc-macro tests skip instead of fail on a
          # compiler with no mapped bridge ABI, so a red 1.98 means something other
          # than the known unmapped table layout.
          - "1.98"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - uses: ./.github/action
        with:
          rust: ${{ matrix.rust }}
