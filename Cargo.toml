[package]
name = "cargo-macra"
version = "0.2.0"
edition = "2024"
rust-version = "1.86"
description = "CLI for working with macro expansion and diagnostics in Rust projects."
keywords = ["cargo", "macros", "tooling", "cli", "diagnostics"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT"
repository = "https://github.com/yasuo-ozu/macra"
homepage = "https://github.com/yasuo-ozu/macra"
documentation = "https://docs.rs/cargo-macra"
readme = "README.md"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]

[features]
default = []
hook = ["dep:libc", "dep:windows-sys"]
rustc-wrapper = ["dep:windows-sys"]

[workspace]
members = ["tests/test-proc-macros", "tests/test-usage"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
syn = { version = "2", features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1.0.44"
filetime = "0.2"
cargo_metadata = "0.23"
libc = { version = "0.2", optional = true }
prettyplease = { version = "0.2", features = ["verbatim"] }
unicode-width = "0.2"

# Restore the terminal when the process is killed from outside (raw mode swallows
# Ctrl-C, so only an external signal reaches us here). Already in the tree via crossterm.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug",
  "Win32_Security",
]
optional = true

[[example]]
name = "macra-hook"
path = "hook/lib.rs"
crate-type = ["cdylib"]
required-features = ["hook"]

[[bin]]
name = "macra-rustc-wrapper"
path = "rustc-wrapper/main.rs"
required-features = ["rustc-wrapper"]
